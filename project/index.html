<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProWall Studio - Projection Mapping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .checkerboard {
            background-image: linear-gradient(45deg, #18212f 25%, transparent 25%), 
                              linear-gradient(-45deg, #18212f 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #18212f 75%), 
                              linear-gradient(-45deg, transparent 75%, #18212f 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden select-none font-sans">

    <!-- TOP NAVIGATION BAR -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0 z-20 shadow-md">
        <div class="flex items-center space-x-4">
            <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                ProWall Studio
            </h1>
            <div class="h-5 w-px bg-slate-800"></div>
            <!-- Add Elements -->
            <div class="flex items-center space-x-1.5">
                <span class="text-xs text-slate-400 uppercase font-semibold mr-1">Add:</span>
                <button onclick="addElement('rect')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded border border-slate-700 transition">Rectangle</button>
                <button onclick="addElement('circle')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded border border-slate-700 transition">Circle</button>
                <button onclick="addElement('star')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded border border-slate-700 transition">Star</button>
                <button onclick="addElement('text')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded border border-slate-700 transition">Text</button>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Project File Operations -->
            <button onclick="exportProject()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded border border-slate-700 transition flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                Export JSON
            </button>
            <label class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded border border-slate-700 transition cursor-pointer flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                Import JSON
                <input type="file" id="importFile" accept=".json" onchange="importProject(event)" class="hidden">
            </label>

            <div class="h-5 w-px bg-slate-800"></div>

            <!-- Present / Projector Options -->
            <button onclick="openProjectorWindow()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded shadow transition flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                Open Projector Window
            </button>
            <button onclick="toggleFullscreen()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded border border-slate-700 transition flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                Fullscreen Preview
            </button>
        </div>
    </header>

    <!-- MAIN APP BODY -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- WALL CANVAS WORKSPACE -->
        <main class="flex-1 bg-slate-900 relative overflow-hidden flex items-center justify-center p-6" id="workspace">
            <div id="wallCanvas" class="relative w-[1200px] h-[675px] bg-slate-950 border border-slate-800 shadow-2xl overflow-hidden checkerboard">
                <!-- Dynamic Elements Rendered Here -->
            </div>
        </main>

        <!-- RIGHT SIDEBAR: INSPECTOR & CONTROLS -->
        <aside class="w-80 bg-slate-900 border-l border-slate-800 flex flex-col z-10 shrink-0">
            <div class="p-3 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Inspector & Properties</h2>
                <span id="selectedName" class="text-xs text-indigo-400 font-mono">No Element Selected</span>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-5" id="inspectorContent">
                <div class="text-center py-12 text-slate-500 text-xs">
                    Click any shape or text element on the wall canvas to inspect, move, or style it.
                </div>
            </div>
        </aside>
    </div>

    <!-- FULLSCREEN PROJECTOR OVERLAY MODAL -->
    <div id="fullscreenOverlay" class="fixed inset-0 bg-black z-50 hidden flex flex-col items-center justify-center">
        <div id="projectorCanvas" class="relative w-[1200px] h-[675px] bg-slate-950 checkerboard overflow-hidden shadow-2xl"></div>
        <button onclick="closeFullscreen()" class="absolute top-4 right-4 bg-slate-800/80 hover:bg-slate-700 text-slate-200 px-3 py-1.5 text-xs rounded border border-slate-700 backdrop-blur transition">
            Exit Fullscreen
        </button>
    </div>

    <script>
        let elements = [];
        let selectedId = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let activeProjectorWindow = null;

        // Initialize Default Layout
        function initDefault() {
            elements = [
                {
                    id: 'el-1',
                    type: 'rect',
                    name: 'Accent Box',
                    x: 180,
                    y: 150,
                    width: 260,
                    height: 180,
                    fill: '#4f46e5',
                    stroke: '#818cf8',
                    strokeWidth: 2,
                    borderRadius: 12,
                    text: '',
                    fontSize: 18,
                    fontFamily: 'sans-serif'
                },
                {
                    id: 'el-2',
                    type: 'text',
                    name: 'Wall Header Text',
                    x: 500,
                    y: 210,
                    width: 320,
                    height: 60,
                    fill: '#ffffff',
                    stroke: '#000000',
                    strokeWidth: 0,
                    borderRadius: 0,
                    text: 'DIGITAL WALL PROJECTION',
                    fontSize: 26,
                    fontFamily: 'sans-serif'
                }
            ];
            selectedId = elements[0].id;
            renderAll();
        }

        // Add Element
        function addElement(type) {
            const id = 'el-' + Date.now();
            let newEl = {
                id,
                type,
                name: type.toUpperCase() + ' ' + (elements.length + 1),
                x: 200 + (elements.length * 20) % 300,
                y: 150 + (elements.length * 20) % 200,
                width: type === 'circle' ? 150 : (type === 'text' ? 300 : 200),
                height: type === 'circle' ? 150 : (type === 'text' ? 60 : 150),
                fill: type === 'text' ? '#ffffff' : '#06b6d4',
                stroke: '#ffffff',
                strokeWidth: type === 'text' ? 0 : 2,
                borderRadius: type === 'circle' ? 75 : 8,
                text: type === 'text' ? 'New Text Design' : '',
                fontSize: 22,
                fontFamily: 'sans-serif'
            };
            elements.push(newEl);
            selectedId = id;
            renderAll();
        }

        // Render Workspace Canvas & Secondary Projector
        function renderAll() {
            renderCanvasContainer('wallCanvas');
            renderInspector();
            
            // Auto-update separate projector window if open
            if (activeProjectorWindow && !activeProjectorWindow.closed) {
                try {
                    activeProjectorWindow.updateProjector(elements);
                } catch(e) {}
            }

            // Auto-update fullscreen overlay if open
            const overlay = document.getElementById('fullscreenOverlay');
            if (!overlay.classList.contains('hidden')) {
                renderCanvasContainer('projectorCanvas');
            }
        }

        function renderCanvasContainer(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            elements.forEach(el => {
                const div = document.createElement('div');
                div.id = containerId + '-' + el.id;
                div.className = `absolute flex items-center justify-center ${containerId === 'wallCanvas' ? 'cursor-move transition-shadow' : ''} ${selectedId === el.id && containerId === 'wallCanvas' ? 'ring-2 ring-indigo-500 shadow-xl z-10' : ''}`;
                div.style.left = el.x + 'px';
                div.style.top = el.y + 'px';
                div.style.width = el.width + 'px';
                div.style.height = el.height + 'px';
                div.style.backgroundColor = el.type === 'text' ? 'transparent' : el.fill;
                div.style.border = `${el.strokeWidth}px solid ${el.stroke}`;
                div.style.borderRadius = el.borderRadius + 'px';

                if (el.type === 'star') {
                    div.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
                }

                if (el.type === 'text') {
                    div.style.color = el.fill;
                    div.style.fontSize = el.fontSize + 'px';
                    div.style.fontFamily = el.fontFamily;
                    div.style.fontWeight = 'bold';
                    div.style.textAlign = 'center';
                    div.style.padding = '8px';
                    div.innerText = el.text;
                }

                // Dragging Events (Only on main workspace)
                if (containerId === 'wallCanvas') {
                    div.addEventListener('mousedown', (e) => {
                        selectedId = el.id;
                        isDragging = true;
                        const rect = div.getBoundingClientRect();
                        dragOffset.x = e.clientX - rect.left;
                        dragOffset.y = e.clientY - rect.top;
                        renderAll();
                        e.stopPropagation();
                    });
                }

                container.appendChild(div);
            });
        }

        // Global Dragging Listeners
        window.addEventListener('mousemove', (e) => {
            if (!isDragging || !selectedId) return;
            const canvasRect = document.getElementById('wallCanvas').getBoundingClientRect();
            const el = elements.find(item => item.id === selectedId);
            if (!el) return;

            let newX = e.clientX - canvasRect.left - dragOffset.x;
            let newY = e.clientY - canvasRect.top - dragOffset.y;

            el.x = Math.max(0, Math.min(canvasRect.width - el.width, newX));
            el.y = Math.max(0, Math.min(canvasRect.height - el.height, newY));

            renderAll();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Inspector Panel UI
        function renderInspector() {
            const nameEl = document.getElementById('selectedName');
            const container = document.getElementById('inspectorContent');
            const el = elements.find(item => item.id === selectedId);

            if (!el) {
                nameEl.innerText = 'No Element Selected';
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">Click any shape or text element on the wall canvas to inspect, move, or style it.</div>`;
                return;
            }

            nameEl.innerText = el.name;
            container.innerHTML = `
                <div class="space-y-4 text-xs">
                    <div>
                        <label class="text-slate-400 block mb-1 font-medium">Element Name</label>
                        <input type="text" value="${el.name}" oninput="updateEl('name', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-slate-400 block mb-1 font-medium">Width (px)</label>
                            <input type="number" value="${el.width}" oninput="updateEl('width', Number(this.value))" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-medium">Height (px)</label>
                            <input type="number" value="${el.height}" oninput="updateEl('height', Number(this.value))" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none">
                        </div>
                    </div>

                    ${el.type === 'text' ? `
                    <div>
                        <label class="text-slate-400 block mb-1 font-medium">Text Content</label>
                        <input type="text" value="${el.text}" oninput="updateEl('text', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1 font-medium">Font Size (px)</label>
                        <input type="number" value="${el.fontSize}" oninput="updateEl('fontSize', Number(this.value))" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none">
                    </div>
                    ` : ''}

                    <div>
                        <label class="text-slate-400 block mb-1 font-medium">${el.type === 'text' ? 'Text Color' : 'Fill Color'}</label>
                        <div class="flex items-center gap-2">
                            <input type="color" value="${el.fill}" oninput="updateEl('fill', this.value)" class="w-10 h-8 bg-slate-800 border border-slate-700 rounded cursor-pointer">
                            <input type="text" value="${el.fill}" oninput="updateEl('fill', this.value)" class="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 font-mono text-slate-200">
                        </div>
                    </div>

                    ${el.type !== 'text' ? `
                    <div>
                        <label class="text-slate-400 block mb-1 font-medium">Border Color</label>
                        <div class="flex items-center gap-2">
                            <input type="color" value="${el.stroke}" oninput="updateEl('stroke', this.value)" class="w-10 h-8 bg-slate-800 border border-slate-700 rounded cursor-pointer">
                            <input type="text" value="${el.stroke}" oninput="updateEl('stroke', this.value)" class="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 font-mono text-slate-200">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-slate-400 block mb-1 font-medium">Border Width</label>
                            <input type="number" value="${el.strokeWidth}" oninput="updateEl('strokeWidth', Number(this.value))" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-medium">Corner Radius</label>
                            <input type="number" value="${el.borderRadius}" oninput="updateEl('borderRadius', Number(this.value))" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200">
                        </div>
                    </div>
                    ` : ''}

                    <div class="pt-4 border-t border-slate-800">
                        <button onclick="deleteElement('${el.id}')" class="w-full py-2 bg-red-950/40 hover:bg-red-900/50 text-red-400 border border-red-900/50 rounded font-medium transition">Delete Element</button>
                    </div>
                </div>
            `;
        }

        function updateEl(prop, val) {
            const el = elements.find(item => item.id === selectedId);
            if (!el) return;
            el[prop] = val;
            renderAll();
        }

        function deleteElement(id) {
            elements = elements.filter(item => item.id !== id);
            selectedId = elements.length ? elements[0].id : null;
            renderAll();
        }

        // Export JSON
        function exportProject() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(elements, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "prowall_project.json");
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        // Import JSON
        function importProject(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    elements = JSON.parse(e.target.result);
                    selectedId = elements.length ? elements[0].id : null;
                    renderAll();
                } catch(err) {
                    alert('Invalid JSON file.');
                }
            };
            reader.readAsText(file);
        }

        // Separate Projector Window Mode
        function openProjectorWindow() {
            activeProjectorWindow = window.open('', 'ProWallProjector', 'width=1200,height=675');
            activeProjectorWindow.document.write(`
                <!DOCTYPE html>
                <html class="h-full">
                <head>
                    <title>Projector Output</title>
                    <script src="https://cdn.tailwindcss.com"></script>
                    <style>.checkerboard { background-image: linear-gradient(45deg, #0b111e 25%, transparent 25%), linear-gradient(-45deg, #0b111e 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #0b111e 75%), linear-gradient(-45deg, transparent 75%, #0b111e 75%); background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0px; }</style>
                </head>
                <body class="h-full bg-black overflow-hidden flex items-center justify-center relative m-0">
                    <div id="pCanvas" class="relative w-[1200px] h-[675px] bg-slate-950 checkerboard overflow-hidden"></div>
                    <button onclick="document.documentElement.requestFullscreen()" class="absolute bottom-4 right-4 bg-slate-900/80 text-slate-300 px-3 py-1.5 text-xs rounded border border-slate-700 z-50">Fullscreen</button>
                    <script>
                        function updateProjector(els) {
                            const c = document.getElementById('pCanvas');
                            c.innerHTML = '';
                            els.forEach(el => {
                                const div = document.createElement('div');
                                div.className = 'absolute flex items-center justify-center';
                                div.style.left = el.x + 'px';
                                div.style.top = el.y + 'px';
                                div.style.width = el.width + 'px';
                                div.style.height = el.height + 'px';
                                div.style.backgroundColor = el.type === 'text' ? 'transparent' : el.fill;
                                div.style.border = \`\${el.strokeWidth}px solid \${el.stroke}\`;
                                div.style.borderRadius = el.borderRadius + 'px';
                                if (el.type === 'star') {
                                    div.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
                                }
                                if (el.type === 'text') {
                                    div.style.color = el.fill;
                                    div.style.fontSize = el.fontSize + 'px';
                                    div.style.fontFamily = el.fontFamily;
                                    div.style.fontWeight = 'bold';
                                    div.style.textAlign = 'center';
                                    div.style.padding = '8px';
                                    div.innerText = el.text;
                                }
                                c.appendChild(div);
                            });
                        }
                    <\/script>
                </body>
                </html>
            `);
            activeProjectorWindow.document.close();
            setTimeout(() => activeProjectorWindow.updateProjector(elements), 300);
        }

        // Fullscreen Overlay Mode
        function toggleFullscreen() {
            document.getElementById('fullscreenOverlay').classList.remove('hidden');
            renderCanvasContainer('projectorCanvas');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenOverlay').classList.add('hidden');
        }

        // Run on load
        initDefault();
    </script>
</body>
</html>
